# Manifiesto de Secret para almacenar las credenciales de acceso a MongoDB codificadas en Base64
apiVersion: v1
kind: Secret
metadata:
  # Nombre del Secret referenciado tanto por MongoDB como por el Backend
  name: db-secret
  # Namespace donde residen todos los recursos de la práctica
  namespace: practica-s08
# Tipo Opaque para datos clave-valor arbitrarios definidos por el usuario
type: Opaque
data:
  # Usuario administrador codificado en Base64 (echo -n 'admin' | base64)
  DB_USER: YWRtaW4=
  # Contraseña codificada en Base64 (echo -n 'admin123' | base64)
  DB_PASS: YWRtaW4xMjM=
